{% set name = "stellarmesh" %}
{% set version = "2.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 45ab6aaa46cc6a633d7013dfe7a1eda78b616b33ea09afa945d8285624c714b1

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [win or py<311]

requirements:
  host:
    - python
    - pip
    - setuptools <81
    - setuptools-scm >=9.2.0,<10
  run:
    - python
    - setuptools <81
    - python-gmsh >=4
    - ocp >=7.8
    - 'moab * *py*'
    - numpy
    - mmgsuite
    - meshio >=5.3.5,<6
    - h5py
    - netcdf4
    - numpy
    - libgl  # [linux]

test:
  imports:
    - stellarmesh

about:
  home: https://github.com/stellarmesh/stellarmesh
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "Meshing library for nuclear workflows"
  description: |
    Stellarmesh is a meshing library for nuclear workflows. Principally, it
    supports the creation of DAGMC geometry from CAD models.
  doc_url: https://stellarmesh.readthedocs.io/
  dev_url: https://github.com/stellarmesh/stellarmesh

extra:
  recipe-maintainers:
    - paulromano
    - akoen
